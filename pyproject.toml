[project]
name = "findex"
version = "0.8.0"
description = "A small search engine built lab by lab: corpus, index, ranking, typed CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "findex" }]
keywords = ["search", "bm25", "tf-idf", "inverted-index", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    # Lab 8: the scorer moves its loop into NumPy. int32 posting arrays,
    # vectorised BM25/TF-IDF and np.argpartition top-k. See findex/vector.py.
    "numpy>=2.0",
    "pydantic-settings>=2.13.0",
    "rich>=15.0.0",
    # Not imported by findex. httpcore (under httpx) does
    # `import sniffio` on every connection-pool primitive and falls back to
    # "asyncio" when it is missing - but a *failed* import is not cached, so
    # each call re-scans sys.path. Measured in bench/lab6.py on Windows:
    # 200 requests at concurrency 20 took 5.1 s without sniffio and 0.88 s
    # with it (22 996 stat() calls, all from importlib).
    "sniffio>=1.3.1",
    "typer>=0.29.1",
    "uvicorn>=0.38.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.hatch.build.targets.sdist]
include = ["src/findex", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "matplotlib>=3.9",
    "psutil>=7.0",
    "pyright>=1.1.414",
    "pytest",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: takes more than a second; skip with -m 'not slow'",
    "benchmark: a pytest-benchmark regression gate (tests/test_bench_perf.py)",
]

[tool.pyright]
# Strict mode is the contract for the shipped library. Tests and bench are
# deliberately outside `include`: they poke at internals and use pytest's
# dynamically typed fixtures, which strict mode is designed to reject.
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src/findex"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection *is* `param = Depends(fn)`: the call happens
# once per request, at route-registration time it is only a marker. B008 exists
# to catch a mutable default evaluated once; this is the opposite pattern.
"src/findex/web/app.py" = ["B008"]
