name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type-check (pyright strict)
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
      - name: Benchmarks (pytest-benchmark)
        run: uv run pytest -q tests/test_bench_perf.py --benchmark-only --benchmark-min-rounds=5
